# Local dev: API + Postgres.  Run:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pushblog
      POSTGRES_PASSWORD: pushblog
      POSTGRES_DB: pushblog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushblog"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      SECRET_KEY: dev-only-secret-change-me
      DATABASE_URL: postgresql+psycopg://pushblog:pushblog@db:5432/pushblog
      CORS_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: local
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
